<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天台夜班 · 民俗密室方向</title>
  <style>
    :root {
      --ink: #171712;
      --night: #13231d;
      --wood: #4a3020;
      --wood-dark: #241912;
      --red: #71372e;
      --paper: #d8c69c;
      --paper-light: #eadbb8;
      --copper: #aa7545;
      --lantern: #d89b55;
      --chalk: #e5d9bc;
      --muted: #b8ac91;
      --scale: 1;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0d100d; }
    body { color: var(--chalk); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 16px; }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid #efd18b; outline-offset: 5px; }
    button { -webkit-tap-highlight-color: transparent; }
    .game {
      position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--scale)); transform-origin: center;
      background: var(--night); box-shadow: 0 0 80px #000;
      isolation: isolate;
    }
    .game::after {
      content: ""; position: absolute; inset: 0; z-index: 90; pointer-events: none; opacity: .2;
      background-image: repeating-linear-gradient(97deg, transparent 0 6px, rgba(238,220,175,.07) 7px, transparent 8px 15px), repeating-linear-gradient(3deg, rgba(0,0,0,.05) 0 1px, transparent 1px 4px);
      mix-blend-mode: overlay;
    }
    .topbar {
      height: 84px; position: relative; z-index: 50; display: flex; align-items: center; justify-content: space-between;
      padding: 0 34px; border-bottom: 3px solid #785236;
      background: repeating-linear-gradient(92deg, rgba(255,255,255,.025) 0 2px, transparent 2px 67px), linear-gradient(#2e241a, #1b1812);
      box-shadow: 0 7px 18px rgba(0,0,0,.55);
    }
    .brand { display: flex; align-items: center; gap: 16px; min-width: 350px; }
    .brand-seal {
      width: 42px; height: 49px; display: grid; place-items: center; border: 2px solid #a65d47; color: #d69172;
      font-family: "STKaiti", "KaiTi", serif; font-size: 18px; line-height: 1.05; transform: rotate(-3deg);
      background: rgba(80,25,20,.24); padding: 3px;
    }
    h1 { margin: 0; font-family: "STKaiti", "KaiTi", "Noto Serif CJK SC", serif; font-size: 34px; font-weight: 600; letter-spacing: .16em; line-height: 1; }
    .brand p { margin: 8px 0 0; color: #aa9b7e; font-family: "SimSun", serif; font-size: 14px; letter-spacing: .12em; }
    .scene-tabs { display: flex; gap: 10px; position: absolute; left: 50%; transform: translateX(-50%); }
    .scene-tab {
      width: 148px; height: 46px; border: 1px solid #796044; background: #2b241b; cursor: pointer;
      clip-path: polygon(6px 0, calc(100% - 8px) 0, 100% 8px, calc(100% - 4px) 100%, 5px 100%, 0 calc(100% - 7px), 0 7px);
      font-family: "SimSun", serif; font-size: 17px; letter-spacing: .14em; transition: background .2s, color .2s;
    }
    .scene-tab:hover { background: #453524; }
    .scene-tab[aria-selected="true"] { color: #231a11; background: var(--paper); border-color: #e7d4a3; font-weight: 700; }
    .scene-tab[aria-selected="true"]::before { content: "◆"; color: var(--red); margin-right: 10px; font-size: 12px; }
    .clock { min-width: 350px; text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 18px; }
    .clock-time { font-family: Georgia, "SimSun", serif; font-size: 32px; letter-spacing: .08em; color: #e1cfaa; }
    .clock-note { color: #b7a98b; font-size: 14px; border-left: 1px solid #68563d; padding-left: 18px; }
    .scene-wrap { position: relative; height: 734px; overflow: hidden; }
    .scene { position: absolute; inset: 0; transition: opacity .25s ease; }
    .scene[hidden] { display: none; }
    .object-button { border: 0; background: none; padding: 0; cursor: pointer; }
    .paper {
      color: #29261d; background-color: var(--paper);
      background-image: repeating-linear-gradient(0deg, transparent 0 20px, rgba(72,53,28,.06) 21px, transparent 22px), linear-gradient(96deg, rgba(255,255,255,.2), transparent 35%, rgba(74,47,21,.08));
      box-shadow: 3px 7px 14px rgba(0,0,0,.38);
    }
    .object-button:hover { filter: brightness(1.13); }
    .object-button:active { transform: translateY(1px); }

    /* 营业区：所有功能物件都在同一幅柜台全景中。 */
    .store {
      background:
        linear-gradient(90deg, rgba(0,0,0,.3), transparent 30%, transparent 70%, rgba(0,0,0,.25)),
        repeating-linear-gradient(90deg, #263027 0 3px, #1b2922 3px 116px, #101b16 117px 120px);
    }
    .store::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 73% 13%, rgba(211,145,69,.18), transparent 37%), linear-gradient(transparent 75%, rgba(0,0,0,.4));
    }
    .ceiling-beam { position: absolute; left: 0; top: 0; width: 100%; height: 28px; background: #231a13; border-bottom: 3px solid #503623; z-index: 2; }
    .ceiling-beam::after { content: ""; position: absolute; inset: 6px 0; background: repeating-linear-gradient(91deg, transparent 0 120px, rgba(173,119,65,.12) 122px, transparent 124px 230px); }
    .rain-window { position: absolute; left: 49px; top: 48px; width: 300px; height: 171px; border: 12px solid #3b2c1e; background: #101f1d; box-shadow: 0 0 0 2px #715034, inset 0 0 28px #050b09; overflow: hidden; }
    .rain-window::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 8px; background: #3c2e21; }
    .rain-window::after { content: ""; position: absolute; left: 0; right: 0; top: 52%; height: 7px; background: #3c2e21; }
    .rain-lines { position: absolute; inset: -30px; opacity: .55; transform: rotate(8deg); background: repeating-linear-gradient(90deg, transparent 0 19px, rgba(176,198,183,.42) 20px, transparent 21px 38px); background-size: 40px 100%; animation: rain 1.8s linear infinite; }
    .window-glow { position: absolute; width: 80px; height: 24px; right: 20px; bottom: 24px; background: #81643f; filter: blur(12px); opacity: .32; }
    .window-caption { position: absolute; left: 62px; top: 190px; z-index: 2; padding: 2px 6px; color: #c8bda2; background: rgba(12,25,21,.72); font-family: "SimSun", serif; font-size: 14px; letter-spacing: .06em; }
    @keyframes rain { to { transform: rotate(8deg) translateY(38px); } }
    .shelf { position: absolute; left: 28px; top: 257px; width: 346px; height: 275px; border: 2px solid #785234; border-top-width: 10px; border-bottom-width: 15px; background: rgba(26,24,17,.73); box-shadow: 9px 10px 0 #17130e; }
    .shelf::before, .shelf::after { content: ""; position: absolute; top: 0; bottom: 0; width: 11px; background: #3c291b; }
    .shelf::before { left: 0; } .shelf::after { right: 0; }
    .shelf-heading { position: absolute; left: 17px; top: -37px; padding: 5px 16px; color: #d4c5a2; background: #342619; border: 1px solid #795337; font-family: "SimSun", serif; font-size: 16px; letter-spacing: .18em; }
    .products { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); height: 100%; padding: 24px 12px 0; gap: 5px; }
    .product { position: relative; height: 220px; color: #e1d3b3; border-right: 1px solid rgba(154,112,68,.23); }
    .product:last-child { border-right: 0; }
    .product-art { height: 128px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; }
    .product-name { display: block; min-height: 25px; font-size: 15px; line-height: 1.45; white-space: normal; text-align: center; }
    .price { display: block; width: 66px; margin: 8px auto 0; padding: 3px 5px; color: #32281b; background: #c8b78e; font-family: Georgia, serif; font-size: 14px; text-align: center; transform: rotate(-2deg); box-shadow: 1px 2px 3px #111; }
    .onigiri { position: relative; width: 76px; height: 70px; clip-path: polygon(50% 0, 100% 100%, 0 100%); background: #d7d0b4; filter: drop-shadow(3px 5px 2px #0d100c); }
    .onigiri::after { content: ""; position: absolute; left: 23px; bottom: 0; width: 31px; height: 35px; background: #273c2e; }
    .onigiri::before { content: ""; position: absolute; left: 30px; top: 25px; width: 8px; height: 8px; border-radius: 50%; background: #a59b7e; box-shadow: 14px 5px 0 #a59b7e, 5px 16px 0 #a59b7e; }
    .capsules { display: flex; gap: 5px; align-items: flex-end; }
    .capsule { width: 24px; height: 47px; border-radius: 50% 50% 5px 5px / 20% 20% 5px 5px; background: linear-gradient(90deg, #574632, #b49665 48%, #49392a 52%, #2f281e); border-bottom: 5px solid #b2a17d; transform: rotate(-5deg); }
    .capsule:nth-child(2) { height: 54px; transform: rotate(4deg); background: linear-gradient(90deg, #472d25, #9a6550 48%, #472d25 52%); }
    .batteries { display: flex; gap: 10px; }
    .battery { position: relative; width: 25px; height: 73px; border-radius: 5px; background: linear-gradient(90deg, #2b2921, #706c50 45%, #292b22 55%); border-bottom: 9px solid #7f4a34; }
    .battery::before { content: ""; position: absolute; left: 7px; top: -6px; width: 11px; height: 6px; background: #b29b70; border-radius: 2px 2px 0 0; }
    .battery::after { content: "+"; position: absolute; left: 7px; top: 9px; color: #c8b991; font-size: 14px; }
    .customer { position: absolute; left: 390px; top: 18px; width: 352px; height: 527px; z-index: 3; pointer-events: none; }
    .customer img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; filter: brightness(.82) sepia(.1); box-shadow: 14px 0 30px rgba(0,0,0,.3); }
    .customer::after { content: ""; position: absolute; inset: 0; box-shadow: inset 18px 0 25px #17251e, inset -16px 0 24px #17251e; pointer-events: none; }
    .customer-label { position: absolute; left: 426px; top: 48px; z-index: 4; color: #c9bfa7; font-size: 14px; letter-spacing: .18em; writing-mode: horizontal-tb; }
    .dialogue { position: absolute; left: 727px; top: 104px; width: 302px; min-height: 161px; z-index: 7; padding: 20px 22px 18px; transform: rotate(1deg); clip-path: polygon(1% 2%, 97% 0, 100% 96%, 4% 100%); }
    .dialogue::after { content: ""; position: absolute; left: 0; bottom: 0; border-style: solid; border-width: 0 0 28px 30px; border-color: transparent transparent #b5a27d transparent; }
    .speaker { display: block; color: #765140; font-size: 14px; margin-bottom: 10px; letter-spacing: .12em; }
    .dialogue p { margin: 0; font-family: "SimSun", serif; font-size: 18px; line-height: 1.65; }
    .dialogue .reply { display: block; margin-top: 6px; color: #66543c; font-size: 15px; }
    .hanging-lamp { position: absolute; left: 884px; top: 0; width: 86px; height: 115px; z-index: 5; }
    .hanging-lamp::before { content: ""; position: absolute; left: 41px; top: 0; width: 3px; height: 33px; background: #17130f; }
    .lamp-shade { position: absolute; left: 5px; top: 30px; width: 76px; height: 52px; clip-path: polygon(17% 0, 83% 0, 100% 100%, 0 100%); background: linear-gradient(90deg, #8a4d2f, #c38245 48%, #6c3826); border-bottom: 6px solid #352317; filter: drop-shadow(0 9px 13px rgba(220,155,72,.28)); }
    .lamp-shade::after { content: ""; position: absolute; left: 30px; bottom: 0; width: 15px; height: 8px; background: #ead09a; border-radius: 50%; }
    .door-zone { position: absolute; right: 38px; top: 29px; width: 308px; height: 536px; z-index: 6; perspective: 1000px; }
    .door-frame { position: absolute; inset: 0 0 34px; padding: 15px; background: #291a13; border: 4px solid #6b442b; box-shadow: 11px 13px 18px rgba(0,0,0,.55), inset 0 0 0 3px #1b120d; }
    .door-inside { position: absolute; inset: 15px; overflow: hidden; background: linear-gradient(90deg, #0a0c09, #18221a); }
    .door-inside::before { content: ""; position: absolute; left: 35px; right: 20px; bottom: 80px; height: 9px; background: #423624; box-shadow: 0 -78px 0 #302a1e, 0 -156px 0 #29251c; opacity: .6; }
    .door-light { position: absolute; right: 0; top: 0; bottom: 0; width: 4px; background: #d4a35f; box-shadow: 0 0 20px rgba(211,155,82,.45); opacity: .35; transition: width .8s, opacity .4s; }
    .door-panel { position: absolute; inset: 15px; transform-origin: left center; transition: transform 1.05s cubic-bezier(.3,.65,.26,1); background: repeating-linear-gradient(86deg, transparent 0 56px, rgba(26,12,8,.3) 58px, transparent 61px 112px), linear-gradient(90deg, #582b25, #713b2f 48%, #49251f); border: 3px solid #321a15; box-shadow: inset 0 0 0 8px #552a23, inset 0 0 0 10px #8a503a; backface-visibility: hidden; }
    .door-panel::before { content: ""; position: absolute; left: 21px; right: 21px; top: 72px; height: 174px; border: 3px solid #3d201a; box-shadow: inset 0 0 0 4px rgba(151,86,55,.32); }
    .door-plaque { position: absolute; left: 50%; top: 95px; transform: translateX(-50%) rotate(-2deg); width: 82px; padding: 9px 0; text-align: center; color: #302317; background: #b69c6b; border: 1px solid #d0b780; font-family: "STKaiti", "KaiTi", serif; font-size: 30px; box-shadow: 2px 3px 5px #25130e; }
    .door-handle { position: absolute; right: 27px; top: 287px; width: 18px; height: 74px; border: 5px solid #a67d48; border-left-width: 8px; border-radius: 45%; transition: transform .25s; box-shadow: 3px 2px 2px #2d170f; }
    .door-lock { position: absolute; right: 19px; top: 252px; width: 43px; height: 32px; display: grid; place-items: center; color: #d0b17b; background: #30251b; border: 2px solid #a77b48; font-family: Georgia, serif; font-size: 15px; letter-spacing: .12em; }
    .talisman { position: absolute; left: 38px; top: 282px; width: 45px; height: 127px; padding-top: 13px; color: #6f3c2d; background: #c5a868; text-align: center; font-family: "STKaiti", "KaiTi", serif; font-size: 19px; line-height: 1.2; transform: rotate(-7deg); clip-path: polygon(4% 0, 100% 3%, 91% 100%, 0 94%); box-shadow: 2px 4px 5px rgba(0,0,0,.35); }
    .talisman i { display: block; width: 24px; height: 2px; margin: 8px auto; background: #884836; transform: rotate(-13deg); }
    .door-hit { position: absolute; inset: 0 0 34px; z-index: 10; cursor: pointer; border: 0; background: transparent; }
    .door-hit:hover + .door-caption, .door-hit:focus-visible + .door-caption { color: #f1d598; }
    .door-caption { position: absolute; left: 0; right: 0; bottom: 67px; height: 32px; padding: 6px 0; text-align: center; font-size: 15px; color: #d5c39e; background: rgba(27,18,13,.78); letter-spacing: .08em; }
    .store.door-opening .door-panel { transform: rotateY(-73deg); }
    .store.door-opening .door-handle { transform: rotate(18deg) translateY(7px); }
    .store.door-opening .door-lock { animation: lock-shiver .25s linear; }
    .store.door-opening .door-light { width: 72px; opacity: .75; }
    @keyframes lock-shiver { 25% { transform: translateX(-3px); } 50% { transform: translateX(3px); } 75% { transform: translateX(-2px); } }
    .counter { position: absolute; left: -20px; right: -20px; top: 504px; height: 230px; z-index: 12; background: repeating-linear-gradient(91deg, transparent 0 135px, rgba(15,8,5,.34) 138px, transparent 141px 270px), linear-gradient(#6a4429 0 17px, #3b281c 18px 28px, #2d2118 29px); border-top: 4px solid #9c6a3d; box-shadow: 0 -13px 28px rgba(0,0,0,.45); }
    .counter::after { content: ""; position: absolute; left: 0; right: 0; top: 35px; height: 2px; background: rgba(157,109,62,.3); box-shadow: 0 94px 0 rgba(157,109,62,.16); }
    .receipt { position: absolute; left: 62px; top: 29px; width: 245px; height: 175px; padding: 14px 19px; transform: rotate(-2deg); text-align: left; clip-path: polygon(0 0, 100% 1%, 98% 95%, 91% 100%, 83% 96%, 75% 100%, 66% 96%, 57% 100%, 48% 96%, 38% 100%, 28% 96%, 18% 100%, 8% 96%, 1% 100%); }
    .receipt-title { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px dashed #776449; padding-bottom: 7px; margin-bottom: 6px; }
    .receipt-title strong { font-family: "SimSun", serif; font-size: 18px; }
    .receipt-title span { font-size: 12px; }
    .receipt-row { display: flex; justify-content: space-between; font-size: 14px; line-height: 1.55; }
    .receipt-total { border-top: 1px dashed #776449; margin-top: 5px; padding-top: 5px; font-weight: 700; }
    .scanner { position: absolute; left: 348px; top: 67px; width: 126px; height: 96px; text-align: center; }
    .scanner-body { position: relative; display: block; width: 108px; height: 58px; margin: 0 auto 9px; background: linear-gradient(150deg, #3a3a30, #151a16); clip-path: polygon(13% 0, 85% 5%, 100% 78%, 87% 100%, 4% 92%, 0 25%); border-bottom: 5px solid #0c0e0c; filter: drop-shadow(5px 7px 4px rgba(0,0,0,.45)); }
    .scanner-body::after { content: ""; position: absolute; left: 16px; right: 15px; top: 15px; height: 3px; background: #b15c44; transform: rotate(4deg); box-shadow: 0 0 5px rgba(176,77,54,.45); }
    .object-label { color: #d5c49e; font-size: 14px; text-shadow: 0 2px 2px #000; }
    .coffee-machine { position: absolute; left: 789px; top: -25px; width: 171px; height: 166px; text-align: center; }
    .machine-body { position: relative; display: block; width: 145px; height: 128px; margin: auto; background: linear-gradient(100deg, #37362c, #716c55 48%, #292a23 52%, #1d211b); clip-path: polygon(8% 0, 93% 0, 100% 12%, 96% 100%, 0 100%, 0 11%); filter: drop-shadow(8px 8px 5px rgba(0,0,0,.45)); }
    .machine-top { position: absolute; left: 12px; right: 12px; top: 15px; height: 22px; background: #20251e; border: 2px solid #8b8062; }
    .machine-face { position: absolute; left: 20px; top: 48px; width: 40px; height: 38px; border: 2px solid #aca080; border-radius: 50%; background: #d1c29b; }
    .machine-face::after { content: ""; position: absolute; left: 18px; top: 4px; width: 2px; height: 15px; background: #6d392b; transform: rotate(35deg); transform-origin: bottom; }
    .machine-spout { position: absolute; right: 26px; top: 53px; width: 25px; height: 39px; border: 7px solid #1c211b; border-top: 0; }
    .coffee-machine .object-label { position: absolute; left: 0; right: 0; bottom: 0; }
    .paper-cup { position: absolute; left: 979px; top: 54px; width: 73px; height: 105px; text-align: center; }
    .cup-body { position: relative; display: block; width: 56px; height: 70px; margin: 0 auto 7px; clip-path: polygon(4% 0, 96% 0, 84% 100%, 17% 100%); background: repeating-linear-gradient(0deg, #c6b78f 0 17px, #a18d65 18px, #c6b78f 20px); filter: drop-shadow(4px 5px 3px rgba(0,0,0,.4)); }
    .cup-body::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7px; background: #e0d1aa; }
    .cup-body::after { content: "夜"; position: absolute; left: 17px; top: 22px; color: #754131; font-family: "STKaiti", "KaiTi", serif; font-size: 23px; }
    .counter-scratch { position: absolute; left: 514px; top: 69px; width: 200px; color: #9d8260; transform: rotate(-3deg); font-family: "STKaiti", "KaiTi", serif; font-size: 17px; opacity: .8; }

    /* 仓库：四个节点以同一水平铜管连接，安装轮廓与实物一致。 */
    .warehouse { background: radial-gradient(ellipse at 75% 39%, rgba(153,108,57,.16), transparent 37%), repeating-linear-gradient(89deg, #20271f 0 2px, #18221b 2px 139px, #101812 141px 144px); }
    .warehouse::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 28px; background: #211911; border-bottom: 3px solid #60452e; }
    .warehouse-heading { position: absolute; left: 42px; top: 43px; margin: 0; font-family: "STKaiti", "KaiTi", serif; font-size: 28px; font-weight: 500; letter-spacing: .14em; color: #d7c6a1; }
    .warehouse-heading small { display: block; margin-top: 8px; color: #a99b7e; font-family: "SimSun", serif; font-size: 14px; letter-spacing: .06em; }
    .blueprint { position: absolute; left: 268px; top: 48px; width: 582px; height: 45px; padding: 10px 19px; transform: rotate(-.5deg); font-family: "SimSun", serif; font-size: 15px; text-align: center; letter-spacing: .06em; clip-path: polygon(1% 3%, 99% 0, 100% 93%, 0 100%); }
    .assembly { position: absolute; left: 26px; top: 111px; width: 872px; height: 397px; border-bottom: 21px solid #2e2117; background: linear-gradient(transparent 82%, rgba(13,15,11,.38)); }
    .assembly::after { content: ""; position: absolute; left: 10px; right: 0; bottom: -28px; height: 8px; background: #8a5b34; box-shadow: 0 8px 11px #080a07; }
    .pipe-rail { position: absolute; left: 116px; top: 206px; width: 722px; height: 50px; z-index: 1; overflow: visible; }
    .pipe-shadow { fill: none; stroke: #090c09; stroke-width: 22; stroke-linecap: round; }
    .pipe-copper { fill: none; stroke: #86603a; stroke-width: 14; stroke-linecap: round; }
    .pipe-light { fill: none; stroke: #c29459; stroke-width: 3; stroke-linecap: round; opacity: .72; }
    .pipe-arrow { fill: #c8a56c; }
    .assembly-node { position: absolute; top: 126px; width: 182px; height: 182px; z-index: 3; }
    .assembly-node.energy { left: 39px; }
    .assembly-node.stabilizer { left: 287px; }
    .assembly-node.focus { left: 535px; }
    .node-object { width: 182px; height: 182px; overflow: visible; filter: drop-shadow(7px 10px 5px rgba(0,0,0,.5)); }
    .mount-outline { fill: rgba(21,24,18,.55); stroke: #a68553; stroke-width: 2; stroke-dasharray: 7 6; }
    .metal { fill: #45483a; stroke: #9a8b65; stroke-width: 3; }
    .dark-metal { fill: #252b24; stroke: #736d52; stroke-width: 3; }
    .copper { fill: #9c6c3f; stroke: #d0a469; stroke-width: 2; }
    .copper-line { fill: none; stroke: #b7834b; stroke-width: 8; }
    .copper-thin { fill: none; stroke: #c39960; stroke-width: 3; }
    .node-label { position: absolute; left: 4px; right: 4px; top: 190px; text-align: center; color: #e1d0ac; font-family: "SimSun", serif; font-size: 16px; white-space: nowrap; }
    .node-label small { display: block; margin-top: 6px; color: #aa9b7c; font-family: "Microsoft YaHei", sans-serif; font-size: 12px; }
    .assembly-node.is-current .mount-outline { stroke: #e1bd78; stroke-width: 4; animation: breathe 1.8s ease-in-out infinite; }
    .assembly-node.is-installed .mount-outline { stroke: #d6be82; stroke-dasharray: none; }
    .assembly-node.is-installed .node-object { filter: drop-shadow(0 0 7px rgba(218,176,102,.48)) drop-shadow(7px 10px 5px rgba(0,0,0,.5)); }
    @keyframes breathe { 50% { stroke-opacity: .4; } }
    .frame-node { position: absolute; left: 761px; top: 167px; width: 116px; height: 100px; z-index: 5; }
    .frame-bracket { width: 116px; height: 100px; filter: drop-shadow(5px 7px 3px #0a0b08); }
    .frame-node .node-label { top: 104px; left: -28px; right: -28px; }
    .frame-node.is-current .mount-outline { stroke: #e1bd78; stroke-width: 4; animation: breathe 1.8s ease-in-out infinite; }
    .frame-node.is-installed .mount-outline { stroke-dasharray: none; stroke: #d6be82; }
    .portal-feed { position: absolute; left: 878px; top: 333px; width: 143px; height: 18px; z-index: 4; border-radius: 9px; background: linear-gradient(#c29459 0 3px, #86603a 4px 13px, #3e2c1c 14px); box-shadow: 0 5px 5px rgba(0,0,0,.45); }
    .portal-feed::after { content: ""; position: absolute; right: -3px; top: -6px; width: 12px; height: 30px; border: 3px solid #a77b48; background: #39291c; }
    .portal { position: absolute; right: 45px; top: 25px; width: 415px; height: 639px; z-index: 2; }
    .portal-shadow { position: absolute; inset: 20px 4px 8px; background: #0b100d; box-shadow: 0 0 0 4px #1a1510, 15px 20px 30px rgba(0,0,0,.6); }
    .portal-opening { position: absolute; left: 75px; top: 50px; width: 268px; height: 535px; overflow: hidden; border: 6px solid #31251b; border-radius: 48% 48% 8px 8px / 12% 12% 5px 5px; background: radial-gradient(ellipse at 50% 48%, #526457 0, #2c4439 24%, #142a23 52%, #09110e 78%); box-shadow: inset 0 0 45px #050b08; }
    .portal-opening::before { content: ""; position: absolute; inset: 13px; border: 2px solid rgba(171,150,102,.45); border-radius: 48% 48% 4px 4px / 12% 12% 3px 3px; box-shadow: 0 0 0 11px rgba(116,107,74,.1), 0 0 0 13px rgba(162,139,91,.24), 0 0 0 28px rgba(75,96,77,.14); }
    .portal-opening::after { content: ""; position: absolute; left: 50%; top: 10%; bottom: 7%; width: 1px; background: rgba(206,191,142,.2); box-shadow: -54px 25px 0 rgba(206,191,142,.1), 54px -13px 0 rgba(206,191,142,.1); transform: rotate(7deg); }
    .portal-mist { position: absolute; inset: 0; opacity: .42; background: repeating-radial-gradient(ellipse at 50% 48%, transparent 0 27px, rgba(190,183,137,.13) 29px, transparent 31px 54px); transform: scaleX(.7); }
    .portal-threshold { position: absolute; left: 63px; bottom: 22px; width: 292px; height: 52px; background: linear-gradient(#8c6b41, #33271b 40%, #171610); clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%); border-top: 3px solid #b08b53; }
    .portal-post { position: absolute; top: 38px; bottom: 38px; width: 61px; background: repeating-linear-gradient(88deg, transparent 0 20px, rgba(21,12,8,.25) 22px, transparent 24px 40px), linear-gradient(90deg, #48271f, #744031 50%, #3d241d); border: 3px solid #2a1913; box-shadow: inset 0 0 0 5px rgba(142,84,53,.23); }
    .portal-post.left { left: 20px; } .portal-post.right { right: 17px; }
    .portal-lintel { position: absolute; left: 16px; right: 12px; top: 14px; height: 75px; background: linear-gradient(#794333, #45271f); border: 4px solid #2b1912; clip-path: polygon(3% 0, 97% 0, 100% 100%, 0 100%); box-shadow: inset 0 -7px 0 rgba(40,20,14,.35); }
    .portal-lintel span { display: block; width: 146px; margin: 14px auto 0; padding: 7px 0; color: #33271a; background: #bca374; text-align: center; font-family: "STKaiti", "KaiTi", serif; font-size: 22px; letter-spacing: .24em; transform: rotate(-1deg); }
    .portal-paper { position: absolute; right: 33px; top: 120px; width: 40px; height: 119px; padding: 12px 7px; color: #743d2c; background: #c1a263; font-family: "STKaiti", "KaiTi", serif; font-size: 18px; text-align: center; transform: rotate(6deg); clip-path: polygon(0 3%, 96% 0, 100% 96%, 5% 100%); }
    .portal-caption { position: absolute; left: 0; right: 0; bottom: -6px; text-align: center; color: #b9a989; font-size: 14px; letter-spacing: .08em; }
    .portal.is-active .portal-opening { background: radial-gradient(ellipse at 50% 48%, #879075 0, #4d6654 24%, #203e31 52%, #0b1711 78%); }
    .calibration { position: absolute; left: 42px; bottom: 22px; width: 846px; height: 177px; padding: 17px 22px; clip-path: polygon(.5% 2%, 99% 0, 100% 95%, 98% 100%, 0 98%); }
    .calibration-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .calibration-title { font-family: "SimSun", serif; font-size: 18px; font-weight: 700; }
    .calibration-note { color: #685a41; font-size: 14px; }
    .wave-box { display: grid; grid-template-columns: 1fr 180px; gap: 22px; align-items: center; }
    .waveform { width: 100%; height: 92px; border-top: 1px solid rgba(78,66,44,.3); border-bottom: 1px solid rgba(78,66,44,.3); background: repeating-linear-gradient(90deg, transparent 0 42px, rgba(75,67,45,.13) 43px, transparent 44px), repeating-linear-gradient(0deg, transparent 0 22px, rgba(75,67,45,.12) 23px, transparent 24px); }
    .wave-grid { stroke: #766a4c; stroke-width: 1; opacity: .35; }
    .wave-path { fill: none; stroke: #6e3f2f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .wave-path.target { stroke: #79806a; stroke-width: 2; stroke-dasharray: 5 6; }
    .calibrate-controls { text-align: left; }
    .calibrate-controls label { display: block; font-size: 14px; color: #4d4331; margin-bottom: 9px; }
    .calibrate-controls input { width: 100%; accent-color: #7a4531; cursor: pointer; }
    .calibrate-button { width: 100%; height: 36px; margin-top: 8px; border: 1px solid #513a26; background: #403324; color: #e0cfa9; cursor: pointer; font-size: 14px; }
    .calibrate-button:hover { background: #5a432c; }
    .warehouse-lantern { position: absolute; right: 424px; top: 28px; width: 55px; height: 79px; border-radius: 45%; background: linear-gradient(90deg, #713b2b, #c18447 50%, #653325); border-top: 7px solid #2a2016; border-bottom: 7px solid #2a2016; box-shadow: 0 8px 28px rgba(207,140,67,.16); opacity: .9; }
    .warehouse-lantern::before { content: ""; position: absolute; left: 25px; top: -30px; height: 24px; width: 2px; background: #0c0e0b; }
    .warehouse-lantern::after { content: ""; position: absolute; left: 25px; bottom: -28px; height: 22px; width: 2px; background: #7b4a31; }

    .footer { position: relative; z-index: 40; height: 82px; display: grid; grid-template-columns: 202px 1fr 330px; align-items: center; border-top: 3px solid #6e4b30; background: repeating-linear-gradient(92deg, rgba(255,255,255,.02) 0 2px, transparent 2px 80px), #1c1812; box-shadow: 0 -8px 20px rgba(0,0,0,.35); }
    .footer-title { padding-left: 34px; font-family: "SimSun", serif; font-size: 17px; letter-spacing: .14em; color: #cbb994; }
    .night-note { margin: 0; padding: 0 24px; border-left: 1px solid #56432e; color: #d4c6a7; font-family: "SimSun", serif; font-size: 16px; line-height: 1.55; min-height: 25px; }
    .controls-hint { padding-right: 30px; text-align: right; color: #a99b7e; font-size: 14px; line-height: 1.55; }
    .controls-hint kbd { padding: 2px 6px; border: 1px solid #716047; color: #d0bd97; background: #2c251b; font-family: inherit; font-size: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .1s !important; }
    }
  </style>
</head>
<body>
  <main class="game" id="game" aria-label="天台夜班民俗密室界面初稿">
    <header class="topbar">
      <div class="brand">
        <span class="brand-seal" aria-hidden="true">夜<br>班</span>
        <div><h1>天台夜班</h1><p>雨声留客，门后无声</p></div>
      </div>
      <nav class="scene-tabs" aria-label="场景切换" role="tablist">
        <button class="scene-tab" id="storeTab" role="tab" aria-selected="true" aria-controls="storeScene">营业区</button>
        <button class="scene-tab" id="warehouseTab" role="tab" aria-selected="false" aria-controls="warehouseScene">仓库</button>
      </nav>
      <div class="clock" aria-label="当前时间 23点47分"><span class="clock-time">23:47</span><span class="clock-note">夜班中 · 雨</span></div>
    </header>

    <div class="scene-wrap">
      <section class="scene store" id="storeScene" role="tabpanel" aria-labelledby="storeTab">
        <div class="ceiling-beam"></div>
        <div class="rain-window" aria-label="雨夜窗"><div class="rain-lines"></div><div class="window-glow"></div></div>
        <span class="window-caption">雨点敲窗，街上没有行人</span>

        <div class="shelf" aria-label="夜班货架">
          <span class="shelf-heading">今夜货架</span>
          <div class="products">
            <button class="object-button product" data-note="饭团还温着，海苔却有些返潮。" aria-label="查看饭团，六元">
              <span class="product-art"><span class="onigiri"></span></span><span class="product-name">饭团</span><span class="price">¥ 6</span>
            </button>
            <button class="object-button product" data-note="咖啡胶囊只剩三枚，锡纸封口完好。" aria-label="查看咖啡胶囊，四元">
              <span class="product-art capsules"><span class="capsule"></span><span class="capsule"></span><span class="capsule"></span></span><span class="product-name">咖啡胶囊</span><span class="price">¥ 4</span>
            </button>
            <button class="object-button product" data-note="两节旧电池，铜帽上有细细的锈痕。" aria-label="查看电池，八元">
              <span class="product-art batteries"><span class="battery"></span><span class="battery"></span></span><span class="product-name">电池</span><span class="price">¥ 8</span>
            </button>
          </div>
        </div>

        <div class="customer"><img src="assets/customer.jpg" alt="站在柜台前的神秘顾客，黑衣，正垂眼看向店员"></div>
        <span class="customer-label">陌生客人</span>
        <div class="dialogue paper">
          <span class="speaker">柜台前的人</span>
          <p>「这么晚了，还不打烊？」<span class="reply">雨停之前，都算营业。</span></p>
        </div>
        <div class="hanging-lamp" aria-hidden="true"><div class="lamp-shade"></div></div>

        <div class="door-zone">
          <div class="door-frame">
            <div class="door-inside"><div class="door-light"></div></div>
            <div class="door-panel" id="doorPanel">
              <span class="door-plaque">仓库</span><span class="door-lock">648</span><span class="door-handle"></span>
              <span class="talisman">勿倚<i></i><i></i><i></i></span>
            </div>
          </div>
          <button class="door-hit" id="doorOpen" aria-label="演示开启仓库门"></button>
          <div class="door-caption">仓库门 · 点击演示开门</div>
        </div>

        <div class="counter">
          <button class="object-button receipt paper" data-note="小票背面写着：门锁648；先接电，再稳流，最后聚光。" aria-label="查看小票">
            <span class="receipt-title"><strong>夜班小票</strong><span>密码 648</span></span>
            <span class="receipt-row"><span>饭团</span><span>6.00</span></span>
            <span class="receipt-row"><span>咖啡胶囊</span><span>4.00</span></span>
            <span class="receipt-row"><span>电池</span><span>8.00</span></span>
            <span class="receipt-row receipt-total"><span>合计</span><span>18.00</span></span>
          </button>
          <button class="object-button scanner" data-note="扫码器亮了一次，小票末端显出「648」。" aria-label="使用扫码器"><span class="scanner-body"></span><span class="object-label">扫码器</span></button>
          <span class="counter-scratch">铜线别碰到雨水。</span>
          <button class="object-button coffee-machine" data-note="咖啡机还有余温，出水口滴着最后一滴咖啡。" aria-label="查看咖啡机"><span class="machine-body"><span class="machine-top"></span><span class="machine-face"></span><span class="machine-spout"></span></span><span class="object-label">咖啡机</span></button>
          <button class="object-button paper-cup" data-note="纸杯是干的，杯底压着一小段铜线。" aria-label="查看纸杯"><span class="cup-body"></span><span class="object-label">纸杯</span></button>
        </div>
      </section>

      <section class="scene warehouse" id="warehouseScene" role="tabpanel" aria-labelledby="warehouseTab" hidden>
        <h2 class="warehouse-heading">仓库装配台<small>旧图纸要求四端同轴，顺序不可颠倒</small></h2>
        <div class="blueprint paper">密码648 · 能源接口 → 线圈稳定器 → 同心聚焦环 → 门框</div>
        <div class="warehouse-lantern" aria-hidden="true"></div>

        <div class="assembly" aria-label="传送门装配台">
          <svg class="pipe-rail" viewBox="0 0 722 50" aria-hidden="true">
            <path class="pipe-shadow" d="M6 25 H716"/><path class="pipe-copper" d="M6 25 H716"/><path class="pipe-light" d="M8 20 H714"/>
            <path class="pipe-arrow" d="M220 17 L232 25 L220 33 Z M456 17 L468 25 L456 33 Z M660 17 L672 25 L660 33 Z"/>
          </svg>

          <button class="object-button assembly-node energy is-current" data-node="0" aria-label="连接能源接口，第一步">
            <svg class="node-object" viewBox="0 0 182 182" aria-hidden="true">
              <path class="mount-outline" d="M49 9 H133 L173 49 V133 L133 173 H49 L9 133 V49 Z"/>
              <path class="metal" d="M55 23 H127 L159 55 V127 L127 159 H55 L23 127 V55 Z"/>
              <circle class="dark-metal" cx="91" cy="91" r="49"/>
              <path class="copper" d="M51 57 H72 V111 H51 Z M110 57 H131 V111 H110 Z"/>
              <rect x="58" y="66" width="8" height="33" rx="3" fill="#24261f"/><rect x="117" y="66" width="8" height="33" rx="3" fill="#24261f"/>
              <circle class="copper" cx="91" cy="127" r="13"/><circle cx="91" cy="127" r="5" fill="#25251e"/>
              <path class="copper-thin" d="M36 44 L48 32 M134 32 L147 45 M36 138 L48 150 M134 150 L147 137"/>
            </svg>
            <span class="node-label">能源接口<small>插座与双铜端子</small></span>
          </button>

          <button class="object-button assembly-node stabilizer" data-node="1" aria-label="连接线圈稳定器，第二步">
            <svg class="node-object" viewBox="0 0 182 182" aria-hidden="true">
              <path class="mount-outline" d="M62 8 H120 L132 28 V126 L159 145 V172 H23 V145 L50 126 V28 Z"/>
              <path class="dark-metal" d="M40 139 H142 L154 162 H28 Z"/>
              <path class="metal" d="M66 25 H116 V137 H66 Z"/>
              <path class="copper-line" d="M52 43 H130 M52 61 H130 M52 79 H130 M52 97 H130 M52 115 H130"/>
              <path class="copper-thin" d="M54 38 C31 47 31 111 54 120 M128 38 C151 47 151 111 128 120"/>
              <circle class="copper" cx="44" cy="132" r="14"/><circle class="copper" cx="138" cy="132" r="14"/>
              <path class="copper-thin" d="M91 17 V3 M82 5 H100"/>
            </svg>
            <span class="node-label">线圈稳定器<small>铜线圈与双配重</small></span>
          </button>

          <button class="object-button assembly-node focus" data-node="2" aria-label="连接同心聚焦环，第三步">
            <svg class="node-object" viewBox="0 0 182 182" aria-hidden="true">
              <circle class="mount-outline" cx="91" cy="91" r="82"/>
              <circle class="copper" cx="91" cy="91" r="68"/>
              <circle class="dark-metal" cx="91" cy="91" r="56"/>
              <circle class="copper-thin" cx="91" cy="91" r="45"/>
              <circle cx="91" cy="91" r="34" fill="#5d7165" stroke="#b6b18d" stroke-width="3"/>
              <path d="M69 77 Q89 56 112 72 Q90 72 75 97 Z" fill="#b8c0a4" opacity=".55"/>
              <path class="copper-thin" d="M91 14 V27 M91 155 V168 M14 91 H27 M155 91 H168 M36 36 L46 46 M136 136 L146 146 M146 36 L136 46 M46 136 L36 146"/>
              <circle cx="91" cy="91" r="12" fill="#24382e" stroke="#98a187" stroke-width="2"/>
            </svg>
            <span class="node-label">同心聚焦环<small>双环与灰绿镜片</small></span>
          </button>

          <button class="object-button frame-node" data-node="3" aria-label="连接门框，第四步">
            <svg class="frame-bracket" viewBox="0 0 116 100" aria-hidden="true">
              <path class="mount-outline" d="M10 8 H78 L106 35 V88 H30 L10 68 Z"/>
              <path class="copper" d="M26 20 H71 L91 40 V73 H40 L26 60 Z"/>
              <circle cx="43" cy="38" r="6" fill="#2a2b22"/><circle cx="72" cy="57" r="6" fill="#2a2b22"/>
              <path class="copper-thin" d="M7 47 H25 M92 47 H116"/>
            </svg>
            <span class="node-label">门框<small>门轴铜扣</small></span>
          </button>
        </div>

        <div class="portal-feed" aria-hidden="true"></div>
        <div class="portal" id="portal" aria-label="完整传送门">

          <div class="portal-post left"></div><div class="portal-post right"></div><div class="portal-lintel"><span>门界未定</span></div>

        </div>

          <div class="calibration-head"><span class="calibration-title">波形校准</span><span class="calibration-note" id="waveStatus">杂波尚未贴合门轴基准</span></div>
          <div class="wave-box">
            <svg class="waveform" viewBox="0 0 580 92" preserveAspectRatio="none" aria-label="校准波形图">
              <path class="wave-grid" d="M0 46 H580 M290 0 V92"/>
              <path class="wave-path target" d="M0 46 C35 6 70 6 105 46 S175 86 210 46 S280 6 315 46 S385 86 420 46 S490 6 525 46 S560 74 580 46"/>
              <path class="wave-path" id="liveWave" d="M0 52 C30 14 55 72 90 33 S150 72 185 43 S245 11 280 53 S350 79 385 34 S450 18 490 60 S550 73 580 40"/>
            </svg>
            <div class="calibrate-controls"><label for="tune">微调门轴同频</label><input id="tune" type="range" min="0" max="100" value="28" aria-label="微调门轴同频"><button class="calibrate-button" id="calibrate">校准波形</button></div>
          </div>
        </div>
      </section>
    </div>

    <footer class="footer">
      <div class="footer-title">当值记录</div>
      <p class="night-note" id="nightNote" aria-live="polite">客人没有买伞。他的袖口却是干的。</p>
      <div class="controls-hint">点击物件查看 · 仓库门可演示开启<br><kbd>Tab</kbd> 选择，<kbd>Enter</kbd> 确认</div>
    </footer>
  </main>

  <script>
    (() => {
      const game = document.getElementById('game');
      const store = document.getElementById('storeScene');
      const warehouse = document.getElementById('warehouseScene');
      const storeTab = document.getElementById('storeTab');
      const warehouseTab = document.getElementById('warehouseTab');
      const note = document.getElementById('nightNote');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let currentScene = 'store';
      let doorTimer = 0;
      let nextNode = 0;

      function fit() {
        document.documentElement.style.setProperty('--scale', Math.min(innerWidth / 1440, innerHeight / 900));
      }
      fit();
      addEventListener('resize', fit);

      function say(text) { note.textContent = text; }
      function switchScene(name) {
        clearTimeout(doorTimer);
        store.classList.remove('door-opening');
        currentScene = name;
        const inStore = name === 'store';
        store.hidden = !inStore;
        warehouse.hidden = inStore;
        storeTab.setAttribute('aria-selected', String(inStore));
        warehouseTab.setAttribute('aria-selected', String(!inStore));
        say(inStore ? '客人没有买伞。他的袖口却是干的。' : '图纸上的四端必须同轴：能源、稳定、聚焦，最后到门框。');
      }
      storeTab.addEventListener('click', () => switchScene('store'));
      warehouseTab.addEventListener('click', () => switchScene('warehouse'));

      document.querySelectorAll('[data-note]').forEach(button => {
        button.addEventListener('click', () => say(button.dataset.note));
      });
      document.getElementById('doorOpen').addEventListener('click', () => {
        if (currentScene !== 'store') return;
        store.classList.remove('door-opening');
        void store.offsetWidth;
        store.classList.add('door-opening');
        say('锁舌退开，门轴正缓缓向里转……');
        doorTimer = setTimeout(() => switchScene('warehouse'), reduceMotion.matches ? 100 : 1400);
      });

      const nodeNames = ['能源接口', '线圈稳定器', '同心聚焦环', '门框'];
      const nodes = [...document.querySelectorAll('[data-node]')];
      function paintNodes() {
        nodes.forEach((node, index) => {
          node.classList.toggle('is-installed', index < nextNode);
          node.classList.toggle('is-current', index === nextNode);
          node.setAttribute('aria-label', `${index < nextNode ? '已连接' : index === nextNode ? '待连接' : '尚未轮到'}${nodeNames[index]}，第${index + 1}步`);
        });
      }
      nodes.forEach((node, index) => {
        node.addEventListener('click', () => {
          if (index < nextNode) { say(`${nodeNames[index]}已经接稳，不要重复拧动。`); return; }
          if (index !== nextNode) { say(`顺序不对。先把导管接向${nodeNames[nextNode]}。`); return; }
          nextNode += 1;
          paintNodes();
          if (nextNode === nodes.length) {
            document.getElementById('portal').classList.add('is-active');
            say('四端同轴，门内泛起旧水纹。传送门已经完整接通。');
          } else {
            say(`${nodeNames[index]}吸附归位。下一端：${nodeNames[nextNode]}。`);
          }
        });
      });

      const tune = document.getElementById('tune');
      const liveWave = document.getElementById('liveWave');
      const waveStatus = document.getElementById('waveStatus');
      tune.addEventListener('input', () => {
        const value = Number(tune.value);
        const lift = (value - 65) * .22;
        liveWave.style.transform = `translateY(${lift}px)`;
        waveStatus.textContent = value === 65 ? '波形已对齐，可以执行校准' : '继续微调，让杂波贴近虚线';
      });
      document.getElementById('calibrate').addEventListener('click', () => {
        if (Number(tune.value) !== 65) {
          say('波形仍有偏差。调整滑杆，让实线贴近虚线后再校准。');
          waveStatus.textContent = '尚有偏差 · 将滑杆调至中段偏右';
          return;
        }
        tune.value = 65;
        liveWave.setAttribute('d', 'M0 46 C35 6 70 6 105 46 S175 86 210 46 S280 6 315 46 S385 86 420 46 S490 6 525 46 S560 74 580 46');
        liveWave.style.transform = 'none';
        waveStatus.textContent = '同频完成 · 波形稳定';
        say('杂波收束成一条稳定水纹，门轴停止了轻颤。');
      });
      paintNodes();
      window.__ready = true;
    })();
  </script>
</body>
</html>
