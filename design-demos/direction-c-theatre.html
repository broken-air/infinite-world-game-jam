<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天台夜班 · 纸偶剧场</title>
<style>
  :root {
    --ink: #171814;
    --deep: #0d1512;
    --paper: #c9b994;
    --paper-light: #e2d4ad;
    --copper: #8d6b45;
    --verdigris: #496b5e;
    --wine: #592c2c;
    --cream: #eee1bd;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    color: var(--cream);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px;
    background:
      radial-gradient(ellipse at 50% 20%, #2a241c 0%, #151510 52%, #090b09 100%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
    opacity: .18; mix-blend-mode: soft-light;
    background-image:
      repeating-linear-gradient(7deg, transparent 0 3px, rgba(255,255,255,.09) 4px, transparent 5px),
      repeating-linear-gradient(93deg, transparent 0 7px, rgba(0,0,0,.12) 8px, transparent 10px);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid #f1dca4; outline-offset: 4px; }
  .theatre { position: relative; width: 100%; height: 100%; min-width: 1100px; min-height: 700px; }
  .outer-frame {
    position: absolute; inset: 15px; pointer-events: none; z-index: 50;
    border: 1px solid #786445;
    box-shadow: inset 0 0 0 5px #191812, inset 0 0 0 6px #4d412e, 0 0 0 1px #090a08;
  }
  .outer-frame::before, .outer-frame::after {
    content: ""; position: absolute; top: 83px; bottom: 37px; width: 29px;
    background:
      linear-gradient(90deg, #191510, #5a4931 38%, #2b2419 62%, #10120e),
      repeating-linear-gradient(0deg, transparent 0 22px, rgba(210,184,127,.15) 23px, transparent 24px);
    border: 1px solid #716043;
    box-shadow: inset 0 0 0 4px #211c14;
  }
  .outer-frame::before { left: 9px; }
  .outer-frame::after { right: 9px; transform: scaleX(-1); }
  .masthead { position: absolute; z-index: 60; left: 64px; right: 64px; top: 25px; height: 65px; }
  .brand { position: absolute; left: 0; top: 0; }
  .brand h1 {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-weight: 600; font-size: 31px; letter-spacing: .22em; margin: 0 0 5px;
    color: #e5d5ad; text-shadow: 0 2px 0 #000;
  }
  .brand p { margin: 0; color: #96896d; font-family: Georgia, serif; font-size: 12px; letter-spacing: .22em; }
  .scene-tabs {
    position: absolute; left: 50%; top: 7px; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 5px 7px 8px;
    background: #12140f; border-top: 1px solid #55492f; border-bottom: 1px solid #55492f;
  }
  .scene-tab {
    position: relative; min-width: 128px; padding: 11px 24px 10px; border: 0;
    background: #28271d; color: #b9ab88; font-size: 15px; letter-spacing: .16em;
    clip-path: polygon(5px 0, calc(100% - 4px) 0, 100% calc(100% - 5px), calc(100% - 6px) 100%, 0 100%, 0 5px);
  }
  .scene-tab::after { content: ""; position: absolute; left: 17px; right: 17px; bottom: 6px; border-bottom: 1px solid transparent; }
  .scene-tab:hover { background: #3a3525; color: #f0dfb4; }
  .scene-tab.active { background: var(--wine); color: #f0dfb9; }
  .scene-tab.active::after { border-color: #b99b65; }
  .clock { position: absolute; right: 4px; top: 0; text-align: right; }
  .clock time { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 31px; letter-spacing: .08em; color: #d8c69d; }
  .clock span { color: #94866a; font-size: 12px; letter-spacing: .16em; }
  .scene {
    display: none; position: absolute; z-index: 2; left: 63px; right: 63px; top: 103px; bottom: 58px;
    overflow: hidden; border: 1px solid #625439;
    background:
      linear-gradient(90deg, rgba(0,0,0,.42), transparent 17%, transparent 83%, rgba(0,0,0,.45)),
      repeating-linear-gradient(90deg, transparent 0 87px, rgba(157,139,93,.035) 88px, transparent 90px),
      #17221c;
    box-shadow: inset 0 0 70px #050806, 0 9px 22px #050604;
  }
  .scene.active { display: block; }
  .scene::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 40;
    box-shadow: inset 0 0 60px 18px rgba(0,0,0,.48);
  }
  .valance {
    position: absolute; z-index: 35; left: 0; right: 0; top: 0; height: 28px; pointer-events: none;
    background:
      repeating-linear-gradient(90deg, #281718 0 22px, #603232 42px, #331d1e 67px),
      #4c2829;
    border-bottom: 2px solid #8b6848;
    box-shadow: 0 7px 12px rgba(0,0,0,.55);
    clip-path: polygon(0 0,100% 0,100% 62%,97% 86%,94% 62%,91% 86%,88% 62%,85% 86%,82% 62%,79% 86%,76% 62%,73% 86%,70% 62%,67% 86%,64% 62%,61% 86%,58% 62%,55% 86%,52% 62%,49% 86%,46% 62%,43% 86%,40% 62%,37% 86%,34% 62%,31% 86%,28% 62%,25% 86%,22% 62%,19% 86%,16% 62%,13% 86%,10% 62%,7% 86%,4% 62%,0 86%);
  }
  .side-curtain { position: absolute; z-index: 34; top: 0; bottom: 0; width: 30px; pointer-events: none; background: repeating-linear-gradient(90deg, #241517 0, #5b2e30 9px, #2d191b 20px); box-shadow: 5px 0 12px rgba(0,0,0,.55); }
  .side-curtain.left { left: 0; }
  .side-curtain.right { right: 0; transform: scaleX(-1); }
  .spot { position: absolute; z-index: 1; top: 0; height: 600px; pointer-events: none; opacity: .5; background: linear-gradient(180deg, rgba(225,199,137,.16), rgba(202,181,127,.035) 70%, transparent); clip-path: polygon(43% 0,57% 0,100% 100%,0 100%); }
  .scene-note {
    position: absolute; z-index: 60; bottom: 19px; left: 68px; max-width: 760px;
    color: #b8aa8b; font-size: 13px; letter-spacing: .04em;
  }
  .scene-note::before { content: ""; display: inline-block; width: 25px; margin: 0 11px 3px 0; border-top: 1px solid #7b6949; }
  .interaction-hint { position: absolute; z-index: 60; bottom: 19px; right: 68px; color: #8f8268; font-size: 12px; }

  /* 营业区：一幕柜台纸偶戏 */
  .rain-window { position: absolute; z-index: 3; left: 55px; top: 58px; width: 298px; height: 264px; padding: 12px; background: #392e20; border: 2px solid #78603e; box-shadow: 7px 9px 0 rgba(0,0,0,.28), inset 0 0 0 3px #171914; }
  .window-glass { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(#101c1c, #1b2b29 65%, #0c1413); border: 1px solid #10130f; }
  .window-glass::before, .window-glass::after { content: ""; position: absolute; z-index: 3; background: #493a27; box-shadow: 0 0 0 1px #171812; }
  .window-glass::before { left: 50%; top: 0; bottom: 0; width: 8px; margin-left: -4px; }
  .window-glass::after { left: 0; right: 0; top: 52%; height: 8px; margin-top: -4px; }
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 83px; background: #0a1110; clip-path: polygon(0 44%,9% 44%,9% 19%,22% 19%,22% 55%,33% 55%,33% 30%,46% 30%,46% 63%,59% 63%,59% 7%,71% 7%,71% 46%,82% 46%,82% 25%,94% 25%,94% 52%,100% 52%,100% 100%,0 100%); }
  .rain-lines { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); opacity: .6; }
  .window-caption { position: absolute; left: 0; top: -25px; color: #9e9276; font-size: 12px; letter-spacing: .16em; }
  .window-latch { position: absolute; z-index: 5; left: 50%; top: 51%; width: 26px; height: 8px; transform: translate(-50%,-50%); background: #8a6d44; border: 1px solid #b18b56; }
  .customer {
    position: absolute; z-index: 5; left: 400px; top: 35px; width: 338px; height: 475px; padding: 5px;
    background: #8b7a5b; filter: drop-shadow(12px 14px 7px rgba(0,0,0,.48));
    clip-path: polygon(3% 0,96% 1%,100% 5%,99% 96%,91% 100%,4% 98%,0 91%,1% 6%);
  }
  .customer img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; clip-path: polygon(3% 0,96% 1%,100% 5%,99% 96%,91% 100%,4% 98%,0 91%,1% 6%); filter: sepia(.08) saturate(.82) brightness(.91) contrast(1.04); }
  .paper-pin { position: absolute; z-index: 7; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d2b878, #665033 70%); box-shadow: 1px 2px 2px #000; }
  .paper-pin.one { left: 408px; top: 48px; }
  .paper-pin.two { left: 719px; top: 50px; }
  .customer-threads { position: absolute; z-index: 2; left: 414px; top: 0; width: 310px; height: 54px; border-left: 1px solid rgba(182,166,124,.4); border-right: 1px solid rgba(182,166,124,.4); pointer-events: none; }
  .dialogue {
    position: absolute; z-index: 8; left: 746px; top: 66px; width: 275px; min-height: 135px; padding: 20px 22px 17px;
    color: #26251d; background: #cabe9b;
    clip-path: polygon(0 4%,8% 0,100% 2%,98% 94%,86% 100%,3% 97%);
    box-shadow: 8px 10px 0 rgba(0,0,0,.25);
  }
  .dialogue::before { content: ""; position: absolute; left: -20px; top: 62px; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-right: 21px solid #cabe9b; }
  .speaker { display: block; margin-bottom: 8px; color: #67583f; font-size: 12px; letter-spacing: .16em; }
  .dialogue p { margin: 0; font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-size: 17px; line-height: 1.75; font-weight: 600; }
  .dialogue small { display: block; margin-top: 7px; color: #544d3d; font-size: 13px; line-height: 1.5; }
  .door-button { position: absolute; z-index: 4; right: 62px; top: 55px; width: 220px; height: 416px; padding: 0; border: 0; background: transparent; perspective: 1000px; }
  .door-frame { position: absolute; inset: 0; padding: 13px; border-radius: 110px 110px 2px 2px; background: linear-gradient(90deg,#30291d,#76603d 18%,#3c3122 50%,#725b3a 82%,#2b241a); border: 2px solid #8b7047; box-shadow: 10px 10px 0 rgba(0,0,0,.3), inset 0 0 0 4px #201c14; }
  .door-dark { position: absolute; inset: 13px; border-radius: 96px 96px 0 0; background: radial-gradient(ellipse at 20% 55%,#4b3c25,#080b09 42%,#030504); }
  .door-leaf { position: absolute; inset: 13px; border-radius: 96px 96px 0 0; transform-origin: left center; transition: transform 1.35s cubic-bezier(.55,.05,.25,1); background: repeating-linear-gradient(86deg,#20231b 0 16px,#292a20 17px,#1a1e17 34px); border: 1px solid #625438; box-shadow: inset 0 0 25px #080a07; }
  .door-leaf::before { content: ""; position: absolute; inset: 56px 22px 25px; border: 1px solid #484833; box-shadow: inset 0 0 0 6px rgba(0,0,0,.15); }
  .door-button.opening .door-leaf { transform: rotateY(-79deg); }
  .door-button.opening .lock { animation: lock-shiver .22s linear 2; }
  .door-sign { position: absolute; left: 50%; top: 102px; transform: translateX(-50%); min-width: 100px; padding: 9px 16px; text-align: center; color: #d5c292; background: #342a1d; border: 1px solid #92734a; font-family: "Songti SC","SimSun",serif; font-size: 20px; letter-spacing: .3em; text-indent: .3em; box-shadow: 2px 3px 0 #10110d; }
  .lock { position: absolute; right: 22px; top: 218px; width: 38px; height: 54px; padding-top: 7px; text-align: center; background: #776243; border: 2px solid #a08052; color: #191a14; font-family: Georgia,serif; font-size: 12px; letter-spacing: 2px; box-shadow: 2px 3px 0 #0c0e0a; }
  .handle { position: absolute; right: 29px; top: 275px; width: 28px; height: 8px; background: #b08a53; border: 1px solid #d1ad70; transform-origin: left center; transition: transform .2s ease .15s; }
  .door-button.opening .handle { transform: rotate(24deg); }
  .door-button:hover .door-leaf { border-color: #b69b68; }
  .door-caption { position: absolute; right: 73px; top: 478px; z-index: 8; width: 200px; text-align: center; color: #a99a79; font-size: 12px; letter-spacing: .08em; }
  .counter { position: absolute; z-index: 10; left: -5px; right: -5px; top: 475px; bottom: -4px; }
  .counter-top { height: 86px; background: linear-gradient(180deg,#7c5130 0%,#513720 24%,#38291d 78%,#211c14); border-top: 3px solid #a47546; transform: perspective(700px) rotateX(3deg); transform-origin: top; box-shadow: 0 -9px 20px rgba(0,0,0,.28); }
  .counter-front { position: absolute; left: 0; right: 0; top: 84px; bottom: 0; background: repeating-linear-gradient(90deg,#241e16 0 62px,#2d251a 63px,#1d1a13 123px,#3b2d1d 125px); border-top: 3px solid #16150f; box-shadow: inset 0 15px 25px rgba(0,0,0,.35); }
  .counter-plaque { position: absolute; left: 50%; top: 119px; transform: translateX(-50%); padding: 10px 38px; border: 1px solid #6c5839; color: #8f7c58; background: #1b1a13; font-family: "Songti SC","SimSun",serif; font-size: 15px; letter-spacing: .28em; white-space: nowrap; }
  .products { position: absolute; z-index: 18; left: 42px; top: 344px; display: flex; gap: 10px; }
  .product { position: relative; width: 116px; height: 178px; padding: 0; border: 0; background: transparent; color: #e0d1aa; }
  .product svg { display: block; width: 106px; height: 108px; margin: 0 auto; filter: drop-shadow(6px 8px 3px rgba(0,0,0,.42)); transition: transform .18s ease; }
  .product:hover svg, .product.selected svg { transform: translateY(-5px) rotate(-1deg); }
  .product.selected::after { content: "已拿起"; position: absolute; right: 1px; top: 5px; padding: 3px 5px; color: #2d281d; background: #cfb77e; font-size: 12px; transform: rotate(4deg); }
  .item-name { display: block; margin-top: 1px; font-size: 15px; line-height: 24px; white-space: nowrap; }
  .price { display: inline-block; min-width: 72px; padding: 2px 7px; color: #2c271c; background: #cbb888; font-family: Georgia,"Times New Roman",serif; font-size: 13px; line-height: 20px; box-shadow: 2px 3px 0 rgba(0,0,0,.3); transform: rotate(-2deg); }
  .receipt { position: absolute; z-index: 21; left: 500px; top: 492px; width: 157px; height: 150px; padding: 11px 13px; border: 0; color: #363126; background: #d4c7a5; text-align: left; transform: rotate(-4deg); clip-path: polygon(0 0,100% 1%,98% 94%,93% 100%,88% 96%,82% 100%,76% 96%,70% 100%,64% 96%,58% 100%,52% 96%,46% 100%,40% 96%,34% 100%,28% 96%,22% 100%,16% 96%,10% 100%,3% 96%); filter: drop-shadow(5px 6px 2px rgba(0,0,0,.35)); }
  .receipt:hover { background: #e1d5b5; }
  .receipt strong { display: block; margin-bottom: 6px; text-align: center; font-family: "Songti SC","SimSun",serif; font-size: 14px; letter-spacing: .08em; }
  .receipt span { display: flex; justify-content: space-between; font-size: 12px; line-height: 18px; white-space: nowrap; }
  .receipt .receipt-rule { display: block; margin: 4px 0; border-top: 1px dashed #796f5b; }
  .receipt small { display: block; margin-top: 3px; text-align: center; font-size: 12px; }
  .scanner { position: absolute; z-index: 20; left: 683px; top: 513px; width: 94px; height: 83px; padding: 0; border: 0; background: transparent; transform: rotate(7deg); }
  .scanner-body { position: absolute; left: 15px; top: 8px; width: 66px; height: 37px; background: linear-gradient(160deg,#4b4b3c,#181d18 65%); border: 2px solid #66604a; clip-path: polygon(8% 0,88% 0,100% 75%,78% 100%,0 88%); box-shadow: 6px 7px 0 rgba(0,0,0,.3); }
  .scanner-body::after { content: ""; position: absolute; left: 14px; right: 12px; top: 10px; height: 3px; background: #8e3e34; box-shadow: 0 0 0 1px #351a16; }
  .scanner-handle { position: absolute; left: 40px; top: 39px; width: 25px; height: 32px; background: #20251e; border: 2px solid #575642; transform: skewX(-12deg); }
  .scanner-label { position: absolute; left: 0; bottom: -3px; width: 100%; color: #c7b792; font-size: 12px; text-align: center; }
  .coffee-machine { position: absolute; z-index: 17; left: 800px; top: 276px; width: 158px; height: 199px; padding: 0; border: 0; background: transparent; filter: drop-shadow(8px 10px 3px rgba(0,0,0,.42)); }
  .machine-shell { position: absolute; inset: 0 7px 15px; background: linear-gradient(90deg,#28332c,#526054 45%,#27332c 75%); border: 2px solid #718073; clip-path: polygon(7% 0,93% 0,100% 9%,96% 100%,4% 100%,0 9%); }
  .machine-top { position: absolute; left: 17px; right: 17px; top: 14px; height: 36px; background: #151d18; border: 1px solid #758071; }
  .machine-top::before { content: ""; position: absolute; left: 17px; top: 12px; width: 36px; height: 7px; background: #a8905f; box-shadow: 55px 0 0 #7e3c32; }
  .machine-face { position: absolute; left: 27px; right: 27px; top: 61px; height: 65px; background: #111813; border: 1px solid #576459; }
  .machine-face::before { content: ""; position: absolute; left: 50%; top: 8px; width: 8px; height: 38px; margin-left: -4px; background: #9a8359; box-shadow: 0 0 0 2px #222b24; }
  .machine-face::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 8px; height: 5px; background: #6e735f; }
  .machine-tray { position: absolute; left: 17px; right: 17px; bottom: 14px; height: 16px; background: repeating-linear-gradient(90deg,#252d26 0 5px,#758071 6px 7px); border: 1px solid #7d8069; }
  .machine-label { position: absolute; left: 0; right: 0; bottom: -7px; text-align: center; font-size: 12px; color: #caba96; }
  .paper-cup { position: absolute; z-index: 22; left: 936px; top: 486px; width: 67px; height: 89px; padding: 0; border: 0; background: transparent; filter: drop-shadow(4px 6px 2px rgba(0,0,0,.35)); }
  .cup-body { position: absolute; left: 8px; top: 10px; width: 51px; height: 64px; background: linear-gradient(90deg,#a79776,#ddd0ab 48%,#b2a27e); clip-path: polygon(0 0,100% 0,84% 100%,16% 100%); border-top: 3px solid #e0d4b6; }
  .cup-body::after { content: "夜"; position: absolute; left: 12px; top: 13px; width: 25px; height: 25px; padding-top: 2px; border: 1px solid #6e4c36; border-radius: 50%; color: #633f30; font-family: "SimSun",serif; font-size: 16px; }
  .paper-cup span { position: absolute; left: 0; right: 0; bottom: 0; color: #d0bf98; font-size: 12px; }

  /* 仓库：后台机械装置与折叠门 */
  #warehouse { background: linear-gradient(90deg,rgba(0,0,0,.5),transparent 20%,transparent 82%,rgba(0,0,0,.5)), repeating-linear-gradient(90deg,transparent 0 115px,rgba(164,140,88,.035) 116px,transparent 118px),#121b17; }
  .rigging { position: absolute; z-index: 1; left: 0; top: 0; width: 100%; height: 260px; opacity: .62; pointer-events: none; }
  .floor { position: absolute; z-index: 1; left: 0; right: 0; top: 588px; bottom: 0; background: repeating-linear-gradient(96deg,#191b15 0 82px,#29261b 84px,#151813 166px); border-top: 2px solid #594a31; box-shadow: inset 0 22px 32px rgba(0,0,0,.45); }
  .back-beam { position: absolute; z-index: 2; top: 25px; bottom: 80px; width: 24px; background: linear-gradient(90deg,#211b13,#5e4b31,#231e15); border: 1px solid #695438; box-shadow: 6px 8px 0 rgba(0,0,0,.25); }
  .back-beam.left { left: 35px; }
  .back-beam.right { right: 31px; }
  .calibration { position: absolute; z-index: 7; left: 69px; top: 55px; width: 622px; height: 182px; padding: 18px 22px 14px; color: #2b2b21; background: #bfb28e; clip-path: polygon(0 3%,3% 0,98% 1%,100% 7%,99% 96%,94% 100%,2% 98%); filter: drop-shadow(8px 10px 3px rgba(0,0,0,.33)); }
  .calibration::before, .calibration::after { content: ""; position: absolute; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 30% 30%,#d5bd7e,#655033 75%); box-shadow: 1px 2px 1px rgba(0,0,0,.45); }
  .calibration::before { left: 13px; }
  .calibration::after { right: 14px; }
  .calibration-head { display: flex; align-items: baseline; justify-content: space-between; position: relative; z-index: 2; }
  .calibration h2 { margin: 0; font-family: "Songti SC","SimSun",serif; font-size: 20px; letter-spacing: .13em; }
  .calibration-status { color: #58533f; font-size: 13px; }
  .wave-grid { position: absolute; left: 22px; top: 51px; width: 425px; height: 91px; border-top: 1px solid #80775e; border-bottom: 1px solid #80775e; background: repeating-linear-gradient(90deg,transparent 0 41px,rgba(69,75,57,.16) 42px),repeating-linear-gradient(0deg,transparent 0 21px,rgba(69,75,57,.16) 22px); }
  .wave-grid svg { width: 100%; height: 100%; }
  .wave-jagged, .wave-clean { fill: none; stroke: #354c40; stroke-width: 2.2; transition: opacity .25s ease; }
  .wave-clean { opacity: 0; stroke: #763d32; }
  .calibration.calibrated .wave-jagged { opacity: .16; }
  .calibration.calibrated .wave-clean { opacity: 1; }
  .calibration-foot { position: absolute; left: 23px; bottom: 12px; color: #625b46; font-size: 12px; letter-spacing: .05em; }
  .calibration-controls { position: absolute; z-index: 3; right: 18px; top: 57px; width: 135px; text-align: center; }
  .dial { position: relative; width: 57px; height: 57px; margin: 0 auto 7px; border-radius: 50%; background: radial-gradient(circle at 40% 35%,#8a805f,#403d2e 68%,#26271e 70%); border: 2px solid #3f4132; box-shadow: 2px 4px 0 rgba(0,0,0,.25); transition: transform .35s ease; }
  .dial::after { content: ""; position: absolute; left: 27px; top: 5px; width: 2px; height: 18px; background: #d1c39a; transform-origin: 1px 23px; transform: rotate(-42deg); transition: transform .35s ease; }
  .calibrated .dial::after { transform: rotate(40deg); }

  <div class="scene-note" id="scene-note" role="status" aria-live="polite">柜台 · 顾客正等你接过小票。</div>
  <span class="footer-mark">一纸之隔，台前台后</span>
  <span class="interaction-hint">点击物件观察 · 菜单随时可切换</span>
</main>
<script>
  const tabs = [...document.querySelectorAll('.scene-tab')];
  const scenes = [...document.querySelectorAll('.scene')];
  const sceneNote = document.getElementById('scene-note');
  const door = document.getElementById('warehouse-door');
  let doorTimer;

  function switchScene(name) {
    scenes.forEach(scene => scene.classList.toggle('active', scene.id === name));
    tabs.forEach(tab => {
      const active = tab.dataset.scene === name;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-pressed', String(active));
    });
    sceneNote.textContent = name === 'store'
      ? '柜台 · 顾客正等你接过小票。'
      : '仓库 · 导管依序接通：能源接口 → 稳定器 → 聚焦环 → 门框。';
  }

  tabs.forEach(tab => tab.addEventListener('click', () => {
    clearTimeout(doorTimer);
    door.classList.remove('opening');
    switchScene(tab.dataset.scene);
  }));

  door.addEventListener('click', () => {
    if (door.classList.contains('opening')) return;
    door.classList.add('opening');
    sceneNote.textContent = '仓库门 · 密码648确认，锁舌回缩，门轴正缓缓向内转动。';
    const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 100 : 1450;
    doorTimer = setTimeout(() => {
      switchScene('warehouse');
      door.classList.remove('opening');
    }, delay);
  });

  const products = [...document.querySelectorAll('.product')];
  products.forEach(product => product.addEventListener('click', () => {
    const wasSelected = product.classList.contains('selected');
    products.forEach(item => {
      item.classList.remove('selected');
      item.setAttribute('aria-pressed', 'false');
    });
    if (!wasSelected) {
      product.classList.add('selected');
      product.setAttribute('aria-pressed', 'true');
    }
    sceneNote.textContent = product.dataset.note;
  }));

  document.querySelectorAll('[data-note]:not(.product):not(.component)').forEach(object => {
    object.addEventListener('click', () => { sceneNote.textContent = object.dataset.note; });
  });

  const components = [...document.querySelectorAll('.component')];
  components.forEach(component => component.addEventListener('click', () => {
    components.forEach(item => {
      item.classList.remove('selected');
      item.setAttribute('aria-pressed', 'false');
    });
    component.classList.add('selected');
    component.setAttribute('aria-pressed', 'true');
    sceneNote.textContent = component.dataset.note;
  }));

  const calibration = document.getElementById('calibration');
  const calibrateButton = document.getElementById('calibrate-button');
  const calibrationStatus = document.getElementById('calibration-status');
  calibrateButton.addEventListener('click', () => {
    const calibrated = calibration.classList.toggle('calibrated');
    calibrationStatus.textContent = calibrated ? '波形已对齐 · 相位 00°' : '相位偏移 · 06°';
    calibrateButton.textContent = calibrated ? '复位波形' : '旋转校准';
    sceneNote.textContent = calibrated ? '波形校准 · 两列波峰已经重合，聚焦环停止轻颤。' : '波形校准 · 相位回到初始偏移。';
  });
</script>
</body>
